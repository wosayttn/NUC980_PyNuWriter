name: Export

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to publish (for example v1.0.0); leave empty for artifacts only"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve export source
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Resolve source commit and release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python .github/scripts/export.py --resolve-release-ref

  export:
    needs: prepare
    name: Export (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            platform: windows-x64
          - os: ubuntu-22.04
            architecture: x64
            platform: linux-x64
          - os: macos-15-intel
            architecture: x64
            platform: macos-x64
          - os: macos-15
            architecture: arm64
            platform: macos-arm64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gui/requirements.txt
            .github/scripts/requirements-export.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 fonts-dejavu-core fonts-noto-core

      - name: Install macOS libusb
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install libusb

      - name: Install export dependencies
        run: python -m pip install -r .github/scripts/requirements-export.txt

      - name: Check test files
        run: python -c "from pathlib import Path; required = ('.github/scripts/test_nuwriter.py', '.github/scripts/test_gui.py', '.github/scripts/test_export.py'); missing = [name for name in required if not Path(name).is_file()]; assert not missing, f'Missing test files {missing}; commit them with the workflow'"

      - name: Run backend tests
        run: python -m unittest discover -s .github/scripts -p test_nuwriter.py -v

      - name: Run GUI tests
        run: python -m unittest discover -s .github/scripts -p test_gui.py -v

      - name: Run export tooling tests
        run: python -m unittest discover -s .github/scripts -p test_export.py -v

      - name: Build and verify extracted standalone archives
        run: python .github/scripts/export.py

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: nuwriter-cli-${{ matrix.platform }}
          path: dist/artifacts/nuwriter-cli-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: nuwriter-gui-${{ matrix.platform }}
          path: dist/artifacts/nuwriter-gui-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish release assets
    needs: [prepare, export]
    if: ${{ needs.export.result == 'success' && needs.prepare.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nuwriter-release-${{ github.repository }}-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download all verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: nuwriter-*
          path: dist/release
          merge-multiple: true

      - name: Verify complete release assets and tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
        run: python .github/scripts/export.py --verify-release-assets dist/release

      - name: Upload packages and checksums to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.sha256