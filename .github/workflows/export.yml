name: Export

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  export:
    name: Export (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            platform: windows-x64
          - os: ubuntu-22.04
            architecture: x64
            platform: linux-x64
          - os: macos-15-intel
            architecture: x64
            platform: macos-x64
          - os: macos-15
            architecture: arm64
            platform: macos-arm64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gui/requirements.txt
            .github/scripts/requirements-export.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 fonts-dejavu-core fonts-noto-core

      - name: Install export dependencies
        run: python -m pip install -r .github/scripts/requirements-export.txt

      - name: Run backend tests
        run: python -m unittest discover -s .github/scripts -p test_nuwriter.py -v

      - name: Run GUI tests
        run: python -m unittest discover -s .github/scripts -p test_gui.py -v

      - name: Run export tooling tests
        run: python -m unittest discover -s .github/scripts -p test_export.py -v

      - name: Build and verify extracted standalone archives
        run: python .github/scripts/export.py

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: nuwriter-cli-${{ matrix.platform }}
          path: dist/artifacts/nuwriter-cli-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: nuwriter-gui-${{ matrix.platform }}
          path: dist/artifacts/nuwriter-gui-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0