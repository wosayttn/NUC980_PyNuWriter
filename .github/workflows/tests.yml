name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gui/requirements.txt

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core fonts-noto-core

      - name: Install Python dependencies
        id: dependencies
        run: python -m pip install -r gui/requirements.txt

      - name: Check test files
        run: python -c "from pathlib import Path; required = ('test_nuwriter.py', 'gui/test_gui.py'); missing = [name for name in required if not Path(name).is_file()]; assert not missing, f'Missing test files {missing}; commit them with the workflow'"

      - name: Run backend tests
        run: python -m unittest discover -s . -p test_nuwriter.py -v

      - name: Run GUI tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest discover -s gui -p test_gui.py -v

      - name: Run export tooling tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest discover -s .github/scripts -p test_export.py -v